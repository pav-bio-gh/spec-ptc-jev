[project]
name = "spec-ptc-jev"
version = "0.1.0"
description = "Natural-language speculation gates for speculative programmatic tool calling (spec-ptc), judged by TypeSafe Jev"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Zach Khorozian", email = "zkhorozianbc@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "spec-ptc>=0.1.1",
    "typesafe-sdk>=0.7.0",
]

[project.scripts]
spec-ptc-jev = "spec_ptc_jev.lint:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

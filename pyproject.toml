[project]
name = "spec-ptc-jev"
version = "0.1.0"
description = "A streaming REPL for code-writing agents: TypeSafe Jev decides which tool calls may start before the code is finished"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Zach Khorozian", email = "zach@pav.bio" }
]
requires-python = ">=3.12"
dependencies = [
    "spec-ptc>=0.1.1",
    "typesafe-sdk>=0.7.0",
]

[project.scripts]
spec-ptc-jev = "spec_ptc_jev.lint:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
examples = [
    "openai>=2.14.0",
    "playwright>=1.63.0",
]

[tool.uv]
default-groups = ["dev", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
